:root{--accent:#6c56da;--ink:#202135;--muted:#7b7c8e;--line:#eaeaf1;--bg:#f7f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid #aa9af6;outline-offset:3px}.app{display:flex;min-height:100vh}aside{width:240px;background:#202136;color:#fff;padding:32px 22px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.brand{font:800 22px Manrope;letter-spacing:-1px;display:flex;align-items:center;gap:10px}.mark{background:#a99af4;color:#202136;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:20px}.brand small{font-size:10px;letter-spacing:1px;color:#b1a5f3}.workspace{border:1px solid #444458;border-radius:10px;margin:36px 0 27px;padding:13px;background:#2b2c43}.workspace small{display:block;color:#aaaabd;font-size:10px;letter-spacing:1.5px;margin-bottom:6px}.navlabel{font-size:10px;letter-spacing:1.6px;color:#9b9bb1;margin:10px 12px}.nav{display:flex;gap:12px;align-items:center;background:transparent;color:#bcbccb;width:100%;padding:13px 14px;text-align:left;border-radius:9px;margin:4px 0}.nav.active{background:#39364f;color:#d8cffd}.nav span{font-size:19px;width:22px}.sidebar-bottom{margin-top:auto;border-top:1px solid #414155;padding-top:24px;color:#c8c8d7;line-height:1.7}.avatar{width:35px;height:35px;border-radius:50%;display:inline-grid;place-items:center;background:#eeeafa;color:var(--accent);font-weight:700}.owner{display:flex;align-items:center;gap:10px;margin-top:20px}.owner small{display:block;color:#9999b3}.main{margin-left:240px;flex:1;min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px}.crumb{color:var(--muted)}.crumb b{color:var(--ink);font-weight:500}.badge{display:inline-block;font-size:11px;line-height:1.4;padding:5px 9px;border-radius:6px;background:#edf7f1;color:#397b59;font-weight:600}.badge.purple{background:#eeeafa;color:#6a52c6}.badge.amber{background:#fff5e5;color:#9d7027}.badge.gray{background:#f0f0f5;color:#77778c}.demo{display:flex;align-items:center;gap:9px;color:#7e6d35;background:#fffcf0;border-bottom:1px solid #f0ead5;padding:10px 40px;font-size:12px}.demo .dot{width:6px;height:6px;background:#b59543;border-radius:50%}.demo button{margin-left:auto;background:transparent;color:#8d793a;text-decoration:underline}.content{padding:34px 40px;max-width:1600px;margin:auto}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.7px;color:var(--accent);text-transform:uppercase}h1{font:800 29px Manrope;letter-spacing:-1px;margin:7px 0 9px}h2{font:700 17px Manrope;margin:0}h3{font:700 14px Manrope;margin:0}.sub{color:var(--muted);line-height:1.6;margin:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.primary{background:var(--accent);color:white;padding:12px 18px;border-radius:8px;font-weight:600;box-shadow:0 4px 9px #6650cc19}.secondary{background:white;border:1px solid #dedee9;color:#525367;padding:10px 14px;border-radius:8px;font-weight:500}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:21px}.stat-top{display:flex;justify-content:space-between;color:#737386;font-size:12px}.stat-icon{color:#9384d6}.number{font:800 29px Manrope;margin:12px 0 9px;letter-spacing:-1px}.foot{font-size:11px;color:#9696a6}.foot em{font-style:normal;color:#559574;margin-right:5px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.cardhead{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line)}.cardhead small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.search{border:1px solid #e6e6ee;background:#fafafe;border-radius:7px;padding:9px 12px;width:190px;outline-color:#b8acf1}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:#9999aa;font-size:10px;letter-spacing:1px;font-weight:500;background:#fcfcfe;padding:13px 23px}td{padding:20px 23px;border-top:1px solid #f1f1f6;white-space:nowrap}td.company{display:flex;gap:12px;align-items:center}.company-icon{width:38px;height:38px;border-radius:10px;background:#efeafb;color:#795cbb;display:grid;place-items:center;font-weight:700;flex-shrink:0}.company-icon img{width:100%;height:100%;object-fit:contain;border-radius:10px}td small{display:block;color:#9393a5;margin-top:5px;font-size:10px}.textbutton{color:var(--accent);background:transparent;font-size:12px;font-weight:600}.panel{padding:22px}.panel p{font-size:12px;color:var(--muted);line-height:1.7}.activity{display:flex;gap:11px;padding:16px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.6}.activity:last-child{border:0}.activity .bubble{width:28px;height:28px;border-radius:50%;background:#f0ecfc;color:#8a75ce;text-align:center;line-height:28px;flex-shrink:0}.activity small{display:block;font-size:10px;color:#aaaabb}.callout{margin-top:20px;background:#efebfc;border:1px solid #e4def8;border-radius:12px;padding:22px}.callout p{font-size:12px;line-height:1.7;color:#807398}.callout button{background:#fff;color:#7058b7;padding:10px 12px;border-radius:7px;font-size:12px}.statusbar{margin-top:24px;display:flex;gap:15px;color:#9292a5;font-size:11px}.statusbar span:first-child{color:#7d6ca6}.empty{padding:50px;text-align:center;color:var(--muted)}.inbox{display:grid;grid-template-columns:310px 1fr;min-height:480px}.message-list{border-right:1px solid var(--line)}.message{width:100%;padding:22px;text-align:left;background:white;border-bottom:1px solid var(--line);line-height:1.6}.message.selected{background:#f5f2ff;border-left:3px solid var(--accent)}.message b{display:block;font-size:12px}.message small{color:var(--muted);font-size:11px}.mailbody{padding:28px;line-height:1.8}.mailbody p{color:#747487}.draft{border:1px solid #e3ddf6;background:#faf8ff;padding:20px;border-radius:10px;margin:24px 0}.draft textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:130px;line-height:1.8;color:#626073;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}input:not([type=color]),textarea,select{max-width:100%}.field{width:100%;border:1px solid #dedee9;background:#fff;border-radius:7px;padding:11px;color:#3b3b50}.form-note{font-size:11px;color:var(--muted);line-height:1.6;margin:7px 0 0}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#19172e80;z-index:30;display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}.modal{width:560px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:30px}.modalhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.close{background:#f3f3f8;border-radius:50%;width:28px;height:28px;font-size:18px}.modal h2{font-size:21px}.modal .actions{margin-top:24px;justify-content:flex-end}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:14px 22px;border-radius:10px;background:#28243c;color:white;z-index:50;box-shadow:0 8px 30px #20213630;font-size:13px}.hidden{display:none!important}.connection{display:flex;align-items:center;gap:18px;padding:25px;border-bottom:1px solid var(--line)}.connection .info{flex:1}.connection p{font-size:12px;color:var(--muted)}.connection-logo{height:44px;width:44px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;font-size:22px;font-weight:800}.preview-title{display:flex;gap:16px;align-items:center}.preview-title .company-icon{width:52px;height:52px;font-size:22px}.settings{max-width:750px;padding:28px}.tour{background:linear-gradient(110deg,#ebe6fb,#f3f0fd);border:1px solid #e4ddf8;padding:20px 24px;border-radius:12px;display:flex;align-items:center;gap:24px;margin-bottom:24px}.tour p{font-size:12px;color:#817596;line-height:1.6;margin:5px 0 0}.tour .step{color:#b5a5e3;font:800 30px Manrope}.tour .primary{margin-left:auto;white-space:nowrap}.viewhint{font-size:11px;color:#9690a8;margin-top:12px}.logo-preview{height:60px;max-width:100px;object-fit:contain}.mobile-brand{display:none}.instruction{padding:14px 18px;background:#f6f4fc;border-radius:8px;font-size:12px;color:#82769b;margin-bottom:20px;line-height:1.7}@media(min-width:1600px){.content{padding-top:45px}}@media(max-width:1200px){aside{width:210px}.main{margin-left:210px}.content{padding:26px}.grid{grid-template-columns:1fr}.sidepanel{display:none}.topbar,.demo{padding-left:26px;padding-right:26px}td,th{padding:17px}.stat{padding:17px}}@media(max-width:760px){aside{width:100%;height:64px;bottom:auto;padding:15px;flex-direction:row;align-items:center;z-index:20;gap:10px}.brand{font-size:18px}.brand small,.workspace,.navlabel,.sidebar-bottom{display:none}.nav{width:auto;padding:8px;margin:0;font-size:11px;gap:5px}.nav span{display:none}aside nav{margin-left:auto;display:flex}.main{margin-left:0;margin-top:64px}.topbar{height:57px;padding:0 18px}.demo{padding:10px 18px;font-size:10px}.content{padding:22px 16px}.stats{grid-template-columns:1fr 1fr;gap:10px}.heading{align-items:flex-start}h1{font-size:24px}.heading .primary{padding:10px;font-size:12px}.tour{gap:12px;padding:15px}.tour .step{display:none}.tour .primary{font-size:11px;padding:10px}.inbox{grid-template-columns:1fr}.message-list{max-height:220px;overflow:auto;border-right:0}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.cardhead{padding:18px;gap:12px}.search{width:125px}.mailbody{padding:20px}.topbar .badge{display:none}.connection{padding:18px;gap:12px}.connection .secondary{font-size:11px}.stat-top{font-size:11px}}
</style></head><body><div class="app"><aside><div class="brand"><span class="mark">↗</span><div>MailAgent <small>AI</small></div></div><div class="workspace"><small>WORKSPACE</small>Olsen Holdings <span style="float:right;color:#9896b2">⌄</span></div><div class="navlabel">MANAGE</div><nav id="nav"></nav><div class="sidebar-bottom"><span class="badge purple">CLIENT DEMO</span><div style="font-size:11px;margin-top:10px">Your workspace. Every company.<br>One intelligent inbox.</div><div class="owner"><span class="avatar">AO</span><div style="font-size:12px">Alex Olsen<small>Platform owner</small></div></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace <span style="margin:0 10px;color:#ccc">/</span> <b id="crumb">Overview</b></div><div style="display:flex;gap:16px;align-items:center"><span class="badge purple">Owner workspace</span><span class="avatar">AO</span></div></header><div class="demo"><span class="dot"></span>Interactive demo · Sample data only · No real emails are sent<button id="reset">Reset demo</button></div><div class="content" id="view"></div></main></div><div id="modalroot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({companies:[{id:1,name:'Alpine Studio',slug:'alpine-studio',color:'#6c56da',industry:'Design & architecture',status:'Active',logo:'',instructions:'Be warm, concise and professional. Offer a discovery call for new projects. Never confirm prices or deadlines without human approval.'},{id:2,name:'Maison Laurent',slug:'maison-laurent',color:'#ae8060',industry:'Hospitality',status:'Active',logo:'',instructions:'Use a welcoming and polished tone. Route booking changes to the reservations team.'},{id:3,name:'Nova Consulting',slug:'nova-consulting',color:'#518c81',industry:'Professional services',status:'Paused',logo:'',instructions:'Keep replies professional and direct. Escalate legal or financial commitments.'}],mailStatus:{},connections:{},devices:[{id:1,name:'Office MacBook',company:'Alpine Studio',status:'Approved'},{id:2,name:'Reception PC',company:'Maison Laurent',status:'Pending approval'}],activity:[]});
let state;try{state=JSON.parse(localStorage.getItem('mailagent-demo-v1'))||initial()}catch{state=initial()}let page='overview',companyId=1,selected=0,filter='';const save=()=>{try{localStorage.setItem('mailagent-demo-v1',JSON.stringify(state))}catch{toast('Storage is full. Changes remain available for this session.')}};
const mails=[{from:'Emma Wilson',address:'emma@example.com',subject:'A new project for our Geneva office',time:'10:42',body:'Hi team,\n\nWe are looking for a design partner to help reimagine our Geneva office. Could we arrange a short call next week to discuss your approach and availability?\n\nMany thanks,\nEmma',draft:'Hi Emma,\n\nThank you for getting in touch. We would be delighted to learn more about your Geneva office project.\n\nCould you share a couple of times that work for a short discovery call next week? Our team will confirm availability.\n\nBest regards,\nThe team',tag:'New opportunity'},{from:'Thomas Meyer',address:'thomas@example.com',subject:'Invoice details for our records',time:'09:18',body:'Hello,\n\nCould you please send us a copy of the invoice for last month and confirm the billing address on file?\n\nThank you,\nThomas',draft:'Hi Thomas,\n\nThanks for your message. I have passed your request to our billing team so they can verify the details and provide the correct invoice.\n\nBest regards,\nThe team',tag:'Billing question'},{from:'Sophie Martin',address:'sophie@example.com',subject:'Thank you for yesterday’s meeting',time:'Yesterday',body:'Hello team,\n\nThank you for taking the time to meet yesterday. It was great to discuss the next steps. We look forward to receiving your proposal.\n\nKind regards,\nSophie',draft:'Hi Sophie,\n\nIt was a pleasure meeting with you as well. Thank you for sharing your ideas and priorities. Our team will follow up with the next steps for your proposal.\n\nKind regards,\nThe team',tag:'Follow-up'}];
function company(){return state.companies.find(c=>c.id===companyId)||state.companies[0]}function icon(c){return `<span class="company-icon" style="background:${esc(c.color)}18;color:${esc(c.color)}">${c.logo?`<img alt="${esc(c.name)} logo" src="${esc(c.logo)}">`:esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>`}function badge(s){return `<span class="badge ${s==='Active'||s==='Approved'?'':s==='Pending approval'?'amber':'gray'}">${esc(s)}</span>`}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.to);window.to=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}function log(t){state.activity.unshift(t);state.activity=state.activity.slice(0,6);save()}function go(p){page=p;render();window.scrollTo(0,0)}
function render(){document.documentElement.style.setProperty('--accent',page==='inbox'||page==='settings'?company().color:'#6c56da');$('#crumb').textContent=({overview:'Overview',companies:'Companies',inbox:'Company inbox',connections:'Connections',devices:'Device access',settings:'Company settings'})[page];$('#nav').innerHTML=[['overview','◫','Overview'],['companies','▦','Companies'],['inbox','✉','Inbox demo'],['connections','⇄','Connections'],['devices','◇','Device access']].map(([id,i,n])=>`<button class="nav ${page===id?'active':''}" data-page="${id}"><span>${i}</span>${n}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#view').innerHTML=page==='overview'?overview():page==='companies'?companies():page==='inbox'?inbox():page==='connections'?connections():page==='devices'?devices():settings();bind()}
function heading(k,title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function stats(){return `<div class="stats">${[[state.companies.length,'Companies','Across your workspace','▦'],[state.companies.filter(c=>c.status==='Active').length,'Active agents','Ready in this demo','✧'],[Object.values(state.mailStatus).filter(x=>x==='Approved').length,'Replies approved','Simulated approvals','✓'],[state.devices.filter(d=>d.status==='Pending approval').length,'Device requests','Waiting for your review','◇']].map(([n,l,f,i])=>`<div class="stat"><div class="stat-top">${l}<span class="stat-icon">${i}</span></div><div class="number">${n}</div><div class="foot">${f}</div></div>`).join('')}</div>`}
function table(){let list=state.companies.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));return `<div class="card"><div class="cardhead"><div><h2>Your companies</h2><small>Brand, configure and manage every client.</small></div><input class="search" id="search" aria-label="Search companies" placeholder="Search companies…" value="${esc(filter)}"></div><div class="table-wrap"><table><thead><tr><th>COMPANY</th><th>AGENT STATUS</th><th>WORKSPACE</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td class="company">${icon(c)}<div><b>${esc(c.name)}</b><small>${esc(c.industry)}</small></div></td><td>${badge(c.status)}</td><td><span style="color:#828297">/${esc(c.slug)}</span><small>Demo company workspace</small></td><td><button class="textbutton open-company" data-id="${c.id}">Open workspace ↗</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No companies found.</td></tr>'}</tbody></table></div></div>`}
function overview(){return heading('Your command center','A little less inbox. A lot more focus.','Every company, every conversation — thoughtfully managed.',`<button class="primary new-company">＋ Add company</button>`)+`<div class="tour"><div class="step">01</div><div><h3>Meet your new email workflow</h3><p>Open a company, review an AI-suggested reply, and try the approval flow.</p></div><button class="primary" id="start-demo">Explore the demo →</button></div>`+stats()+`<div class="grid"><div>${table()}<div class="statusbar"><span>✧ Built for your brand</span><span>Owner-managed workspaces</span><span>Human-reviewed replies</span></div></div><div class="sidepanel"><div class="card panel"><h2>Workspace activity</h2>${[...state.activity,'Sample workspaces are ready','Office MacBook is approved','Reception PC requested access'].slice(0,4).map((t,i)=>`<div class="activity"><span class="bubble">${i===0?'✧':'✓'}</span><div>${esc(t)}<small>${i===0?'This demo session':'Sample activity'}</small></div></div>`).join('')}</div><div class="callout"><h3>Your clients. Their identity.</h3><p>Set up each company’s name, logo and colors before you hand over their workspace.</p><button class="new-company">Create a company →</button></div></div></div>`}
function companies(){return heading('Owner workspace','A home for every company.','You control the branding, agent instructions and access.',`<button class="primary new-company">＋ Add company</button>`)+table()}
function picker(){return `<select class="field" id="company-picker" style="width:210px" aria-label="Select company">${state.companies.map(c=>`<option value="${c.id}" ${company().id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}function inbox(){let c=company(),m=mails[selected],s=state.mailStatus[c.id+'-'+selected];return heading('Company workspace',esc(c.name),'A calmer inbox, with you in control.',picker())+`<div class="card"><div class="cardhead"><div class="preview-title">${icon(c)}<div><h2>Inbox & approvals</h2><small>3 sample conversations · Human approval enabled</small></div></div><button class="secondary" id="edit-company">Company settings</button></div>${c.status==='Paused'?'<div class="instruction" style="margin:16px">This demo agent is paused. You can still review sample conversations.</div>':''}<div class="inbox"><div class="message-list">${mails.map((m,i)=>`<button class="message ${selected===i?'selected':''}" data-mail="${i}"><div style="display:flex;justify-content:space-between"><b>${m.from}</b><small>${m.time}</small></div><div>${m.subject}</div><small>${esc(state.mailStatus[c.id+'-'+i]||'Ready for review')} · ${m.tag}</small></button>`).join('')}</div><div class="mailbody"><span class="badge purple">${m.tag}</span><h2 style="margin-top:16px;font-size:20px">${m.subject}</h2><div style="font-size:11px;color:#999;margin-top:8px">${m.from} &lt;${m.address}&gt; · Sample sender</div><p style="white-space:pre-line">${m.body}</p><div class="draft"><div style="display:flex;justify-content:space-between"><b style="color:var(--accent)">✧ Suggested reply</b><span class="badge ${s?'':'amber'}">${esc(s||'Needs your approval')}</span></div><textarea id="reply" aria-label="Edit suggested reply">${esc(state['draft-'+c.id+'-'+selected]||m.draft.replace('The team',c.name+' team'))}</textarea><div class="form-note">Sample suggestion. Editable for this presentation; no live AI or email sending.</div></div><div class="actions"><button class="primary" id="approve" ${s?'disabled style="opacity:.5"':''}>✓ Approve demo reply</button><button class="secondary" id="route">Route to a teammate</button><button class="textbutton" id="reset-reply">Reset conversation</button></div></div></div></div>`}
function connections(){return heading('Mailbox connections','Bring your conversations together.','Preview how clients will connect Gmail and Infomaniak.',picker())+`<div class="instruction">Demo connections only. This screen does not request passwords, access mailboxes or start monitoring.</div><div class="card">${[['Gmail','G','Connect with Google and review the requested mailbox permissions.'],['Infomaniak','i','Connect an Infomaniak mailbox through a secure server-side connection.']].map(([name,i,desc])=>`<div class="connection"><div class="connection-logo" style="color:${name==='Gmail'?'#d76c60':'#4084c9'}">${i}</div><div class="info"><h2>${name}</h2><p>${desc}</p>${state.connections[company().id+'-'+name]?'<span class="badge purple">Demo connected · Monitoring simulated</span>':'<span class="badge gray">Not connected</span>'}</div><button class="secondary connect" data-provider="${name}">${state.connections[company().id+'-'+name]?'Disconnect demo':'Simulate connection'}</button></div>`).join('')}</div>`}
function devices(){return heading('Owner-managed access','The right people. Approved access.','Preview the device request and owner approval workflow.')+`<div class="instruction">Presentation only: these controls update sample records. They do not enforce device security or register real passkeys.</div><div class="card"><div class="cardhead"><h2>Device requests</h2><button class="secondary" id="new-device">＋ Simulate request</button></div><div class="table-wrap"><table><thead><tr><th>DEVICE</th><th>COMPANY</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>${state.devices.map(d=>`<tr><td><b>${esc(d.name)}</b><small>Sample device</small></td><td>${esc(d.company)}</td><td>${badge(d.status)}</td><td><button class="textbutton device-action" data-id="${d.id}">${d.status==='Approved'?'Revoke':d.status==='Revoked'?'Approve again':'Approve device'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function settings(){let c=company();return heading('Owner configuration','Make it feel like '+esc(c.name)+'.','Branding and agent instructions are managed by you.',`<button class="secondary" id="back-inbox">← Back to inbox</button>`)+`<div class="card settings"><form id="settings-form"><div class="formgrid"><div><label for="setting-name">Company name</label><input required maxlength="60" class="field" id="setting-name" value="${esc(c.name)}"></div><div><label for="setting-color">Brand color</label><input id="setting-color" type="color" value="${esc(c.color)}" style="height:41px;width:100%;border:1px solid #ddd;border-radius:7px;background:white"></div><div class="full"><label for="setting-instructions">AI reply instructions</label><textarea id="setting-instructions" class="field" rows="5" maxlength="3000">${esc(c.instructions)}</textarea><p class="form-note">Saved for the demo. Live AI processing is not connected.</p></div><div><label for="setting-status">Agent status</label><select class="field" id="setting-status"><option ${c.status==='Active'?'selected':''}>Active</option><option ${c.status==='Paused'?'selected':''}>Paused</option></select></div><div><label for="setting-logo">Company logo</label><input id="setting-logo" class="field" type="file" accept="image/png,image/jpeg,image/webp"><p class="form-note">PNG, JPG or WebP, up to 500 KB. Stored in this browser.</p></div>${c.logo?`<div>${icon(c)}<button type="button" class="textbutton" id="remove-logo">Remove logo</button></div>`:''}</div><div class="actions" style="margin-top:25px"><button class="primary" type="submit">Save company settings</button></div></form></div>`}
function bind(){document.querySelectorAll('.new-company').forEach(b=>b.onclick=createCompany);document.querySelectorAll('.open-company').forEach(b=>b.onclick=()=>{companyId=Number(b.dataset.id);selected=0;go('inbox')});if($('#search'))$('#search').oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;$('#view').innerHTML=page==='overview'?overview():companies();bind();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#start-demo'))$('#start-demo').onclick=()=>{companyId=state.companies[0].id;go('inbox')};if($('#company-picker'))$('#company-picker').onchange=e=>{companyId=Number(e.target.value);render()};document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.mail);render()});if($('#edit-company'))$('#edit-company').onclick=()=>go('settings');if($('#back-inbox'))$('#back-inbox').onclick=()=>go('inbox');if($('#reply'))$('#reply').oninput=e=>{state['draft-'+company().id+'-'+selected]=e.target.value;save()};if($('#approve'))$('#approve').onclick=()=>{if(!$('#reply').value.trim())return toast('Add a reply before approving.');state.mailStatus[company().id+'-'+selected]='Approved';log('A demo reply was approved for '+company().name);render();toast('Reply approved in the demo. No email was sent.')};if($('#reset-reply'))$('#reset-reply').onclick=()=>{delete state.mailStatus[company().id+'-'+selected];delete state['draft-'+company().id+'-'+selected];save();render()};if($('#route'))$('#route').onclick=routeModal;document.querySelectorAll('.connect').forEach(b=>b.onclick=()=>{let k=company().id+'-'+b.dataset.provider;state.connections[k]=!state.connections[k];save();render();toast(state.connections[k]?'Demo connection added. No mailbox access was requested.':'Demo connection removed.')});document.querySelectorAll('.device-action').forEach(b=>b.onclick=()=>{let d=state.devices.find(d=>d.id===Number(b.dataset.id));d.status=d.status==='Approved'?'Revoked':'Approved';log(d.name+' access '+d.status.toLowerCase());render();toast('Sample device '+d.status.toLowerCase()+'.')});if($('#new-device'))$('#new-device').onclick=()=>{state.devices.push({id:Date.now(),name:'Client laptop '+(state.devices.length+1),company:company().name,status:'Pending approval'});save();render()};if($('#settings-form'))$('#settings-form').onsubmit=async e=>{e.preventDefault();let c=company(),f=$('#setting-logo').files[0],logo=c.logo;try{if(f)logo=await readLogo(f)}catch(err){return toast(err.message)}c.name=$('#setting-name').value.trim();if(!c.name)return toast('Enter a company name.');c.color=$('#setting-color').value;c.instructions=$('#setting-instructions').value;c.status=$('#setting-status').value;c.logo=logo;log('Branding updated for '+c.name);render();toast('Company settings saved in this browser.')};if($('#remove-logo'))$('#remove-logo').onclick=()=>{company().logo='';save();render()}}
function modal(title,subtitle,body){$('#modalroot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${title}</h2><p class="sub" style="font-size:12px;margin-top:7px">${subtitle}</p></div><button class="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;$('.close').onclick=closeModal;$('.modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()};let first=$('.modal input,.modal select');if(first)first.focus()}function closeModal(){$('#modalroot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){let fs=[...$('.modal').querySelectorAll('button,input,select,textarea')];let first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function readLogo(f){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(f.type))return reject(new Error('Choose a PNG, JPG or WebP image.'));if(f.size>500000)return reject(new Error('Choose a logo smaller than 500 KB.'));let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('The image could not be read.'));r.readAsDataURL(f)})}
function createCompany(){modal('A new company. Your signature.','Set up the client’s identity before presenting their workspace.',`<form id="company-form"><div class="formgrid"><div class="full"><label for="new-name">Company name</label><input required class="field" id="new-name" placeholder="e.g. Horizon Partners" maxlength="60"></div><div><label for="new-slug">Workspace ID</label><input required pattern="[a-z0-9]+(-[a-z0-9]+)*" class="field" id="new-slug" placeholder="horizon-partners" maxlength="50"><p class="form-note">Demo identifier; no domain is registered.</p></div><div><label for="new-industry">Industry</label><input class="field" id="new-industry" placeholder="e.g. Consulting" maxlength="60"></div><div><label for="new-color">Brand color</label><input type="color" id="new-color" value="#6c56da" style="width:100%;height:41px;background:white;border:1px solid #ddd;border-radius:7px"></div><div><label for="new-logo">Logo (optional)</label><input type="file" id="new-logo" class="field" accept="image/png,image/jpeg,image/webp"><p class="form-note">Up to 500 KB · Stored locally</p></div></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" type="submit">Create demo workspace →</button></div></form>`);$('#cancel').onclick=closeModal;$('#new-name').oninput=e=>{$('#new-slug').value=e.target.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50).replace(/-$/,'')};$('#company-form').onsubmit=async e=>{e.preventDefault();let name=$('#new-name').value.trim(),slug=$('#new-slug').value;if(!name)return toast('Enter a company name.');if(state.companies.some(c=>c.slug===slug))return toast('Choose a unique workspace ID.');let logo='',f=$('#new-logo').files[0];try{if(f)logo=await readLogo(f)}catch(err){return toast(err.message)}let c={id:Date.now(),name,slug,color:$('#new-color').value,industry:$('#new-industry').value.trim()||'Client workspace',logo,status:'Active',instructions:'Be helpful, concise and professional. Ask for human approval before making commitments.'};state.companies.push(c);companyId=c.id;log('Demo workspace created for '+name);closeModal();go('inbox');toast('Your branded demo workspace is ready.')};}
function routeModal(){modal('Pass it to the right person.','Simulate a human handoff for this conversation.',`<form id="route-form"><label for="route-team">Team</label><select class="field" id="route-team"><option>Client services</option><option>Billing team</option><option>Company owner</option></select><label for="route-note" style="margin-top:18px">Internal note</label><textarea class="field" id="route-note" rows="3" placeholder="Add context for your teammate…"></textarea><p class="form-note">This is a demo action. No notification or email will be sent.</p><div class="actions"><button class="primary">Route demo conversation</button></div></form>`);$('#route-form').onsubmit=e=>{e.preventDefault();state.mailStatus[company().id+'-'+selected]='Routed to '+$('#route-team').value;save();closeModal();render();toast('Conversation routed in the demo. No message was sent.')}}
$('#reset').onclick=()=>{modal('Reset the presentation?','This removes changes saved in this browser and restores the sample companies.',`<div class="actions"><button class="secondary" id="keep">Keep changes</button><button class="primary" id="confirm-reset">Reset demo</button></div>`);$('#keep').onclick=closeModal;$('#confirm-reset').onclick=()=>{state=initial();save();companyId=1;selected=0;filter='';closeModal();go('overview');toast('Demo restored and ready to present.')}};render();
</script></body></html>
