<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=[
 {id:'alpine-studio',name:'Alpine Studio',color:'#6c56da',industry:'Design & architecture',logo:'',status:'Active'},
 {id:'maison-laurent',name:'Maison Laurent',color:'#ae8060',industry:'Hospitality',logo:'',status:'Active'},
 {id:'nova-consulting',name:'Nova Consulting',color:'#518c81',industry:'Professional services',logo:'',status:'Paused'}
];
const sampleSet=[
 ['Emma Wilson','emma@example.com','A new project for our Geneva office','Hi team,\n\nCould we arrange a short call next week to discuss a new project?\n\nMany thanks,\nEmma'],
 ['Thomas Meyer','thomas@example.com','Invoice details for our records','Hello,\n\nCould you send us a copy of last month’s invoice and confirm the billing address?\n\nThank you,\nThomas'],
 ['Sophie Martin','sophie@example.com','Thank you for yesterday’s meeting','Hello team,\n\nIt was lovely meeting yesterday. We look forward to hearing about the next steps.\n\nKind regards,\nSophie']
];
const newCompany=c=>({...c,slug:c.id,instructions:'Be warm, concise and professional. Do not invent prices, deadlines or commitments.',human:`team+${c.id}@example.com`,rules:[{id:'billing',sender:'thomas@example.com',to:`billing+${c.id}@example.com`}],connections:{Gmail:true,Infomaniak:true},messages:[]});
function initial(){return {companies:defaults.map(newCompany)}}
let state;try{state=JSON.parse(localStorage.getItem('mailagent-company-demo-v2'))||initial();if(!Array.isArray(state.companies)||!state.companies.length)state=initial()}catch{state=initial()}
const params=new URLSearchParams(location.search),tenantSlug=params.get('company');
let tenant=!!tenantSlug,companyId=tenantSlug||state.companies[0].id,page=tenant?'inbox':'overview',selected=null,provider='All',statusFilter='All',search='';
if(tenant&&!state.companies.some(c=>c.id===tenantSlug)){
 if(/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(tenantSlug)&&params.get('name'))state.companies.push(newCompany({id:tenantSlug,name:params.get('name').slice(0,60),color:/^#[0-9a-f]{6}$/i.test(params.get('color'))?params.get('color'):'#6c56da',industry:'Client workspace',logo:'',status:'Active'}));
 else {document.body.innerHTML='<main style="max-width:600px;margin:15vh auto;padding:30px;font:16px sans-serif"><h1>Company page not found</h1><p>Check the company link with the demo presenter.</p><a href="/">Open demo owner workspace</a></main>';throw new Error('Unknown demo company');}
}
function company(){return state.companies.find(c=>c.id===companyId)||state.companies[0]}
function save(){try{localStorage.setItem('mailagent-company-demo-v2',JSON.stringify(state))}catch{toast('Browser storage is full. Changes remain in this session.')}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),5000)}
function icon(c){return `<span class="company-icon" style="background:${esc(c.color)}18;color:${esc(c.color)}">${c.logo?`<img src="${esc(c.logo)}" alt="${esc(c.name)} logo">`:esc(c.name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</span>`}
function badge(text,type=''){return `<span class="badge ${type}">${esc(text)}</span>`}
function date(){return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function processMessage(c,m){
 const rule=c.rules.find(r=>r.sender.trim().toLowerCase()===m.address.trim().toLowerCase());
 if(!c.connections[m.provider]){m.status='Waiting for connection';m.reason=`${m.provider} demo connection is off.`;return}
 if(rule){m.status='Forwarded to human';m.to=rule.to;m.reply='';m.reason=`Sender matched ${rule.sender}. Automatic reply skipped.`;return}
 if(c.status!=='Active'){m.status='Agent paused';m.reason='Automatic replies are paused for this company.';return}
 m.status='AI replied';m.reason='No human-forwarding rule matched. Automatic reply simulated.';
 m.reply=`Hi ${m.from.split(' ')[0]},\n\nThank you for your email about “${m.subject}”. We have received your message. Could you share any additional details that would help our team assist you?\n\nBest regards,\n${c.name} team`;
}
function seed(c,index){if(c.messages.length)return;let subjects=index===1?['A question about our upcoming stay','Invoice for our reservation','Thank you for a wonderful visit']:index===2?['A consultation for our new project','Invoice for this month’s services','Following up on our strategy meeting']:sampleSet.map(m=>m[2]);c.messages=sampleSet.map((s,i)=>{let m={id:'sample-'+i,from:s[0],address:s[1],subject:subjects[i],body:index?`Hello ${c.name} team,\n\n${i===0?'Could you help us with a new enquiry?':i===1?'Could you send a copy of our latest invoice?':'Thank you for your time. What are the next steps?'}\n\nBest regards,\n${s[0].split(' ')[0]}`:s[3],provider:i===1?'Infomaniak':'Gmail',time:['10:42','09:18','Yesterday'][i]};processMessage(c,m);return m})}
state.companies.forEach(seed);save();
function companyUrl(c){let p=new URLSearchParams({company:c.id});if(!defaults.some(d=>d.id===c.id)){p.set('name',c.name);p.set('color',c.color)}return location.origin+location.pathname+'?'+p.toString()}
function go(p){page=p;selected=null;render();window.scrollTo(0,0)}
function heading(k,title,sub,actions=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`}
function picker(){return tenant?'':`<select class="field" style="width:210px" id="company-picker" aria-label="Select company">${state.companies.map(c=>`<option value="${esc(c.id)}" ${c.id===company().id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}
function render(){let c=company();document.documentElement.style.setProperty('--accent',tenant||page!=='overview'&&page!=='companies'?c.color:'#6c56da');document.title=tenant?`${c.name} — MailAgent AI Demo`:'MailAgent AI — Owner Demo';
 $('.brand').innerHTML=tenant?`${icon(c)}<div style="font-size:17px;max-width:145px;overflow-wrap:anywhere">${esc(c.name)}</div>`:'<span class="mark">↗</span><div>MailAgent <small>AI</small></div>';
 $('.workspace').innerHTML=tenant?'<small>YOUR WORKSPACE</small>Company inbox':'<small>WORKSPACE</small>Olsen Holdings';
 $('.navlabel').textContent=tenant?'YOUR EMAIL':'MANAGE';
 $('.sidebar-bottom').innerHTML=`${badge('CLIENT DEMO','purple')}<p style="font-size:11px;color:#b8b6ce;line-height:1.8">${tenant?'Automatic replies.<br>Human when it matters.':'Your clients. Their own pages.<br>One intelligent email service.'}</p><div class="owner"><span class="avatar">${tenant?esc(c.name[0]):'AO'}</span><div style="font-size:12px">${tenant?esc(c.name):'Alex Olsen'}<small>${tenant?'Company workspace':'Platform owner'}</small></div></div>`;
 $('.topbar').innerHTML=`<div class="crumb">${tenant?esc(c.name):'Owner workspace'} <span style="margin:0 10px;color:#ccc">/</span><b id="crumb">${({overview:'Overview',companies:'Companies',inbox:'Inbox',workflow:'Settings',branding:'Branding'})[page]}</b></div>${badge(tenant?'Company demo':'Owner demo','purple')}`;
 let nav=tenant?[['inbox','✉','Inbox'],['workflow','⚙','Settings']]:[['overview','◫','Overview'],['companies','▦','Companies'],['inbox','✉','Inbox preview'],['workflow','⚙','Email settings'],['branding','◇','Branding']];
 $('#nav').innerHTML=nav.map(([p,i,n])=>`<button class="nav ${p===page?'active':''}" data-page="${p}"><span>${i}</span>${n}</button>`).join('');
 $('#view').innerHTML=page==='overview'?overview():page==='companies'?companies():page==='inbox'?inbox():page==='workflow'?workflow():branding();
 bind();
}
function companyTable(){return `<div class="card"><div class="cardhead"><div><h2>Company websites</h2><small>Each link opens a company’s own inbox and settings.</small></div></div><div class="table-wrap"><table><thead><tr><th>COMPANY</th><th>AGENT</th><th>COMPANY PAGE</th><th></th></tr></thead><tbody>${state.companies.map(c=>`<tr><td class="company">${icon(c)}<div><b>${esc(c.name)}</b><small>${esc(c.industry)}</small></div></td><td>${badge(c.status,c.status==='Active'?'':'gray')}</td><td><a class="textbutton" href="${esc(companyUrl(c))}" style="text-decoration:none">${esc(c.slug)} ↗</a><small>Company-specific demo link</small></td><td><button class="textbutton preview-company" data-company="${esc(c.id)}">Preview</button><button class="textbutton copy-link" data-company="${esc(c.id)}">Copy link</button></td></tr>`).join('')}</tbody></table></div></div>`}
function overview(){let all=state.companies.flatMap(c=>c.messages);return heading('Owner workspace','Their company. Their inbox.','Create branded company pages, then let each client manage their email workflow.',`<button class="primary" id="new-company">＋ Add company</button>`)+`<div class="tour"><div class="step">↗</div><div><h3>New email → AI reply, or a human handoff</h3><p>Sender rules are checked first. Matching messages go to a human with no AI reply.</p></div><a class="primary" style="text-decoration:none" href="${esc(companyUrl(state.companies[0]))}">Open company demo →</a></div><div class="stats">${[[state.companies.length,'Company pages','Individual company links'],[all.filter(m=>m.status==='AI replied').length,'AI replies','Simulated automatic replies'],[all.filter(m=>m.status==='Forwarded to human').length,'Human handoffs','Sender rules matched'],[2,'Mail providers','Gmail + Infomaniak']].map(([n,t,f])=>`<div class="stat"><div class="stat-top">${t}</div><div class="number">${n}</div><div class="foot">${f}</div></div>`).join('')}</div>${companyTable()}<p class="viewhint">Presentation pages only. Real customer separation, inbox access and continuous sending need a secure backend.</p>`}
function companies(){return heading('Owner workspace','A website for every company.','Set the branding here. Give the company its own demo link.',`<button class="primary" id="new-company">＋ Add company</button>`)+companyTable()}
function mailbox(c,p){return p==='Gmail'?c.slug.replace(/-/g,'.')+'.demo@gmail.com':'hello@'+c.slug+'.example.com'}
function visibleMessages(c){return c.messages.filter(m=>(provider==='All'||m.provider===provider)&&(statusFilter==='All'||m.status===statusFilter)&&[m.subject,m.address,m.from].some(v=>v.toLowerCase().includes(search.toLowerCase())))}
function inbox(){let c=company(),list=visibleMessages(c),m=list.find(m=>m.id===selected)||list[0];selected=m?.id||null;return heading('Company inbox',esc(c.name),'Gmail and Infomaniak, together. Your AI handles new mail.',picker()+`<button class="primary" id="receive-mail">＋ Simulate new email</button>`)+`<div class="agentbar"><div><span class="live-dot ${c.status==='Active'?'':'paused'}"></span><b>Automatic replies ${c.status==='Active'?'on':'paused'}</b><span class="agentcopy">Sender rules take priority · ${c.rules.length} human forwarding rule${c.rules.length===1?'':'s'}</span></div><button class="textbutton" id="open-settings">Manage settings →</button></div><div class="card"><div class="filters"><div class="provider-tabs">${['All','Gmail','Infomaniak'].map(p=>`<button class="${provider===p?'selected':''}" data-provider-filter="${p}">${p==='All'?'All mail':p}</button>`).join('')}</div><select class="field" id="status-filter" aria-label="Filter email status" style="width:190px"><option value="All">All statuses</option>${['AI replied','Forwarded to human','Agent paused','Waiting for connection'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select><input class="search" id="mail-search" aria-label="Search emails" placeholder="Search emails…" value="${esc(search)}"></div><div class="inbox"><div class="message-list">${list.map(x=>`<button class="message ${selected===x.id?'selected':''}" data-mail="${esc(x.id)}"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(x.from)}</b><small>${esc(x.time)}</small></div><div>${esc(x.subject)}</div><small>${esc(x.provider)} · ${esc(x.status)}</small></button>`).join('')||'<div class="empty">No emails match these filters.</div>'}</div><div class="mailbody">${m?mailDetail(c,m):'<div class="empty">Your inbox is clear.</div>'}</div></div></div>`}
function mailDetail(c,m){return `<div class="actions">${badge(m.provider,'purple')}${badge(m.status,m.status==='Forwarded to human'?'amber':m.status==='AI replied'?'':'gray')}</div><h2 style="font-size:21px;margin-top:18px">${esc(m.subject)}</h2><div class="mailmeta"><b>${esc(m.from)}</b> &lt;${esc(m.address)}&gt;<br>To: ${esc(mailbox(c,m.provider))} · ${esc(m.time)} · Sample email</div><p style="white-space:pre-line">${esc(m.body)}</p>${m.status==='AI replied'?`<div class="draft"><div class="drafthead"><b>✧ Automatic AI reply</b>${badge('Simulated sent')}</div><p style="white-space:pre-line">${esc(m.reply)}</p><div class="form-note">This sample reply was created automatically when the demo email arrived.</div></div>`:m.status==='Forwarded to human'?`<div class="handoff"><b>↗ Forwarded to a human</b><p>To: ${esc(m.to)}</p><p>${esc(m.reason)}</p><small>No AI reply was sent. Forwarding is simulated.</small></div>`:`<div class="instruction">${esc(m.reason)} No reply was sent.</div>`}${m.previousReply?`<details class="instruction"><summary>Earlier simulated AI reply</summary><p style="white-space:pre-line">${esc(m.previousReply)}</p></details>`:''}<div class="actions"><button class="secondary" id="manual-human">Forward to a human</button></div>`}
function workflow(){let c=company();return heading('Company settings','AI for the routine. Humans for the rest.','Choose which senders should always go to a person.',picker())+`<div class="settings-grid"><div><div class="card"><div class="cardhead"><div><h2>Automatic replies</h2><small>For new emails without a matching human rule.</small></div><button class="secondary" id="toggle-agent">${c.status==='Active'?'Pause auto replies':'Enable auto replies'}</button></div><form id="agent-form" class="panel"><label for="agent-instructions">Instructions for your AI</label><textarea class="field" id="agent-instructions" maxlength="3000" rows="4">${esc(c.instructions)}</textarea><p class="form-note">The demo stores your instructions. Replies use sample text; a live AI model is not connected.</p><label for="default-human" style="margin-top:18px">Default human email</label><input class="field" id="default-human" type="email" required value="${esc(c.human)}"><p class="form-note">Used when you manually forward a conversation.</p><button class="primary" style="margin-top:20px">Save settings</button></form></div><div class="card" style="margin-top:22px"><div class="cardhead"><div><h2>Always forward these senders</h2><small>Exact email match · Case insensitive · AI does not reply</small></div></div><div class="panel"><form id="rule-form"><div class="formgrid"><div><label for="rule-sender">If the sender is</label><input type="email" class="field" id="rule-sender" required placeholder="sender@example.com"></div><div><label for="rule-to">Forward to this human</label><input type="email" class="field" id="rule-to" required placeholder="colleague@example.com"></div></div><div class="actions" style="margin-top:16px"><button class="primary">＋ Add forwarding rule</button></div></form></div><div>${c.rules.map(r=>`<div class="rule-row"><div><b>${esc(r.sender)}</b><p>↗ ${esc(r.to)}</p></div><span class="badge amber">Human only</span><button class="textbutton remove-rule" aria-label="Remove rule for ${esc(r.sender)}" data-rule="${esc(r.id)}">Remove</button></div>`).join('')||'<div class="empty">No rules yet. New messages will follow the automatic reply setting.</div>'}</div></div></div><div><div class="card"><div class="cardhead"><h2>Connected mailboxes</h2></div>${['Gmail','Infomaniak'].map(p=>`<div class="connection" style="padding:20px;display:block"><div style="display:flex;justify-content:space-between"><h3>${p}</h3>${badge(c.connections[p]?'Demo connected':'Disconnected',c.connections[p]?'purple':'gray')}</div><p style="overflow-wrap:anywhere">${esc(mailbox(c,p))}</p><button class="textbutton toggle-provider" data-provider="${p}">${c.connections[p]?'Disconnect demo':'Connect demo'}</button></div>`).join('')}</div><div class="callout"><h3>The order matters</h3><p>1. Receive a Gmail or Infomaniak email.<br>2. Check sender forwarding rules.<br>3. Forward a match to the chosen human.<br>4. Otherwise, automatically reply if the agent is on.</p></div><p class="viewhint">New rules apply to future demo emails. No real mailbox is connected and no messages leave this demo.</p></div></div>`}
function branding(){let c=company();return heading('Owner configuration','Make it feel like '+esc(c.name)+'.','Only the demo owner interface includes company branding.',picker())+`<div class="card settings"><form id="branding-form"><div class="formgrid"><div><label for="brand-name">Company name</label><input class="field" id="brand-name" required maxlength="60" value="${esc(c.name)}"></div><div><label for="brand-color">Color</label><input type="color" id="brand-color" value="${esc(c.color)}" style="height:40px;width:100%"></div><div class="full"><label for="brand-logo">Logo</label><input class="field" type="file" id="brand-logo" accept="image/png,image/jpeg,image/webp"><p class="form-note">Up to 500 KB. Logos and demo changes are stored in this browser.</p></div></div><button class="primary" style="margin-top:22px">Save branding</button></form><p class="form-note" style="margin-top:20px">Company link: <a href="${esc(companyUrl(c))}">${esc(companyUrl(c))}</a></p></div>`}
function readLogo(f){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>500000)return reject(new Error('Choose a PNG, JPG or WebP smaller than 500 KB.'));let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read this image.'));r.readAsDataURL(f)})}
let focusBefore;
function modal(title,sub,body){focusBefore=document.activeElement;$('#modalroot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${title}</h2><p class="sub" style="font-size:12px;margin-top:8px">${sub}</p></div><button class="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;$('.close').onclick=closeModal;$('.modalback').onclick=e=>{if(e.target===e.currentTarget)closeModal()};($('.modal input')||$('.modal button')).focus()}
function closeModal(){$('#modalroot').innerHTML='';if(focusBefore?.isConnected)focusBefore.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){let f=[...$('.modal').querySelectorAll('button,input,textarea,select')],a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function createCompany(){modal('Create a company website','Configure the company, then open its separate demo page.',`<form id="company-form"><div class="formgrid"><div class="full"><label for="new-name">Company name</label><input class="field" id="new-name" required maxlength="60" placeholder="Horizon Partners"></div><div><label for="new-slug">Company page ID</label><input class="field" id="new-slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="50" placeholder="horizon-partners"></div><div><label for="new-color">Brand color</label><input type="color" id="new-color" value="#6c56da" style="height:41px;width:100%"></div><div class="full"><label for="new-logo">Logo (optional)</label><input class="field" type="file" id="new-logo" accept="image/png,image/jpeg,image/webp"><p class="form-note">Up to 500 KB. Logo saved in this browser.</p></div></div><div class="actions"><button class="primary">Create company page</button></div></form>`);$('#new-name').oninput=e=>{$('#new-slug').value=e.target.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50).replace(/-$/,'')};$('#company-form').onsubmit=async e=>{e.preventDefault();let id=$('#new-slug').value,name=$('#new-name').value.trim();if(!name)return toast('Enter a company name.');if(state.companies.some(c=>c.id===id))return toast('That page ID already exists.');let logo='',f=$('#new-logo').files[0];try{if(f)logo=await readLogo(f)}catch(err){return toast(err.message)}let c=newCompany({id,name,color:$('#new-color').value,logo,status:'Active',industry:'Client workspace'});seed(c,0);state.companies.push(c);save();companyId=id;closeModal();go('companies');toast('Company page created. Use its link to open the client view.')};}
function receiveMail(){modal('Simulate an incoming email','The demo immediately checks the sender rule and replies or forwards.',`<form id="incoming-form"><div class="scenario"><button type="button" class="secondary" id="scenario-ai">Try AI reply</button><button type="button" class="secondary" id="scenario-human">Try human rule</button></div><div class="formgrid"><div><label for="incoming-sender">Sender email</label><input class="field" type="email" id="incoming-sender" required value="emma@example.com"></div><div><label for="incoming-provider">Receiving mailbox</label><select class="field" id="incoming-provider"><option>Gmail</option><option>Infomaniak</option></select></div><div class="full"><label for="incoming-subject">Subject</label><input class="field" id="incoming-subject" required maxlength="200" value="A question about your services"></div><div class="full"><label for="incoming-body">Message</label><textarea class="field" id="incoming-body" rows="3" required maxlength="5000">Hello, could you tell me more about your services?</textarea></div></div><p class="form-note">Sample data only. No email is received or sent outside this browser.</p><div class="actions"><button class="primary">Receive demo email →</button></div></form>`);$('#scenario-ai').onclick=()=>{$('#incoming-sender').value='emma@example.com';$('#incoming-subject').value='A question about your services'};$('#scenario-human').onclick=()=>{let r=company().rules[0];if(!r)return toast('Add a sender forwarding rule in Settings first.');$('#incoming-sender').value=r.sender;$('#incoming-subject').value='A message for your team'};$('#incoming-form').onsubmit=e=>{e.preventDefault();let address=$('#incoming-sender').value.trim(),m={id:'mail-'+Date.now(),address,from:address.split('@')[0],provider:$('#incoming-provider').value,subject:$('#incoming-subject').value.trim(),body:$('#incoming-body').value.trim(),time:date()};if(!m.subject||!m.body)return toast('Add a subject and message.');processMessage(company(),m);company().messages.unshift(m);save();selected=m.id;provider='All';statusFilter='All';search='';closeModal();render();toast(m.status==='AI replied'?'New email received → automatic reply simulated.':m.status==='Forwarded to human'?'Sender rule matched → human forwarding simulated.':m.reason)};}
function manualForward(){let c=company(),m=c.messages.find(m=>m.id===selected);if(!m)return;modal('Forward to a human','Hand over this conversation. The demo will not send an email.',`<form id="forward-form"><label for="forward-to">Human email</label><input class="field" type="email" id="forward-to" required value="${esc(c.human)}"><p class="form-note">${m.status==='AI replied'?'The earlier simulated automatic reply remains in this conversation’s history.':''}</p><div class="actions"><button class="primary">Forward demo email</button></div></form>`);$('#forward-form').onsubmit=e=>{e.preventDefault();m.to=$('#forward-to').value.trim();m.reason='Manually forwarded by the company.';if(m.reply)m.previousReply=m.reply;m.reply='';m.status='Forwarded to human';save();closeModal();render();toast('Human forwarding simulated.')};}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(tenant&&!['inbox','workflow'].includes(b.dataset.page))return;go(b.dataset.page)});if($('#new-company'))$('#new-company').onclick=createCompany;
 document.querySelectorAll('.preview-company').forEach(b=>b.onclick=()=>{companyId=b.dataset.company;provider='All';statusFilter='All';search='';go('inbox')});
 document.querySelectorAll('.copy-link').forEach(b=>b.onclick=async()=>{let c=state.companies.find(c=>c.id===b.dataset.company),url=companyUrl(c);try{await navigator.clipboard.writeText(url);toast('Company demo link copied.')}catch{modal('Company demo link','Copy this link to open the company’s own page.',`<input class="field" readonly value="${esc(url)}" aria-label="Company demo link">`)}});
 if($('#company-picker'))$('#company-picker').onchange=e=>{companyId=e.target.value;selected=null;provider='All';statusFilter='All';search='';render()};
 document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{selected=b.dataset.mail;render()});
 document.querySelectorAll('[data-provider-filter]').forEach(b=>b.onclick=()=>{provider=b.dataset.providerFilter;selected=null;render()});
 if($('#status-filter'))$('#status-filter').onchange=e=>{statusFilter=e.target.value;selected=null;render()};
 if($('#mail-search'))$('#mail-search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('#mail-search').focus();$('#mail-search').setSelectionRange(pos,pos)};
 if($('#open-settings'))$('#open-settings').onclick=()=>go('workflow');if($('#receive-mail'))$('#receive-mail').onclick=receiveMail;if($('#manual-human'))$('#manual-human').onclick=manualForward;
 if($('#toggle-agent'))$('#toggle-agent').onclick=()=>{company().status=company().status==='Active'?'Paused':'Active';save();render();toast('Automatic replies '+(company().status==='Active'?'enabled':'paused')+' for future demo emails.')};
 if($('#agent-form'))$('#agent-form').onsubmit=e=>{e.preventDefault();company().instructions=$('#agent-instructions').value;company().human=$('#default-human').value.trim();save();toast('Company settings saved in this browser.')};
 if($('#rule-form'))$('#rule-form').onsubmit=e=>{e.preventDefault();let sender=$('#rule-sender').value.trim().toLowerCase(),to=$('#rule-to').value.trim();if(sender===to.toLowerCase())return toast('Choose a human destination different from the sender.');if(company().rules.some(r=>r.sender.toLowerCase()===sender))return toast('A rule for that sender already exists. Remove it before replacing it.');company().rules.push({id:'rule-'+Date.now(),sender,to});save();render();toast('New emails from this sender will go to the human, without an AI reply.')};
 document.querySelectorAll('.remove-rule').forEach(b=>b.onclick=()=>{company().rules=company().rules.filter(r=>r.id!==b.dataset.rule);save();render();toast('Forwarding rule removed for future demo emails.')});
 document.querySelectorAll('.toggle-provider').forEach(b=>b.onclick=()=>{let p=b.dataset.provider;company().connections[p]=!company().connections[p];save();render();toast(p+' demo connection '+(company().connections[p]?'enabled':'disconnected')+'. No real account was accessed.')});
 if($('#branding-form'))$('#branding-form').onsubmit=async e=>{e.preventDefault();let name=$('#brand-name').value.trim();if(!name)return toast('Enter a company name.');let f=$('#brand-logo').files[0],logo=company().logo;try{if(f)logo=await readLogo(f)}catch(err){return toast(err.message)}Object.assign(company(),{name,color:$('#brand-color').value,logo});save();render();toast('Branding saved in this browser.')};
}
$('#reset').onclick=()=>{modal('Reset this presentation?',tenant?'Restore this company’s sample emails and forwarding rules.':'Restore all sample companies and remove this browser’s demo changes.',`<div class="actions"><button class="secondary" id="keep-changes">Keep changes</button><button class="primary" id="confirm-reset">Reset demo</button></div>`);$('#keep-changes').onclick=closeModal;$('#confirm-reset').onclick=()=>{if(tenant){let i=state.companies.findIndex(c=>c.id===companyId),old=company(),d=defaults.find(c=>c.id===companyId);let c=newCompany(d||{id:old.id,name:old.name,color:old.color,industry:old.industry,logo:old.logo,status:'Active'});seed(c,Math.max(0,defaults.findIndex(x=>x.id===c.id)));state.companies[i]=c}else state=initial();state.companies.forEach(seed);save();provider='All';statusFilter='All';search='';selected=null;closeModal();go(tenant?'inbox':'overview');toast('Demo restored.')}};
render();

</script></body></html>
